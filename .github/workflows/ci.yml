name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Run Windows tests
        run: cargo test --locked
      - name: Build Windows MSVC release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Package portable application
        shell: pwsh
        run: |
          $package = 'dist/taikosim'
          New-Item -ItemType Directory -Force "$package/data/songs" | Out-Null
          Set-Content -Path "$package/data/songs/README.txt" -Value 'Place TJA and audio in a song subdirectory.'
          Copy-Item 'target/x86_64-pc-windows-msvc/release/taikosim.exe' "$package/taikosim.exe"
          Copy-Item 'assets' "$package/assets" -Recurse
          Copy-Item 'config.example.json' "$package/config.json"
          Copy-Item 'README.md' "$package/README.md"
          Compress-Archive -Path $package -DestinationPath 'dist/taikosim-windows-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: taikosim-windows-x64
          path: dist/taikosim-windows-x64.zip
          if-no-files-found: error
